plugins {
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'com.google.cloud.tools.jib' version '3.4.1'
}
java {
    sourceCompatibility = '17'
}
group = 'org.cris.cmm'
//version = '0.0.1-SNAPSHOT'
version = 'vt211'



jib{
    from{
        image = 'localhost:50001/openjdk:17-jdk-alpine'
        auth{
            username = 'admin'
            password = '65ce9f2a-ea4a-4afb-8300-67bf3c3b3c5f'

        }
    }
    to{
        image = 'default-route-openshift-image-registry.apps.cmm-fmm-dev.roams.org/openshift/raketrainset'
        //image = '172.16.22.54:10001/repository/oci/raketrainset'
        tags = ["$version", 'latest']
        auth{
            username = 'abhishek'
            password = 'sha256~N7Yey8HcycoZL5MVrUI6QFrL7IeWhujUCfVeNhhJoPE'

        }

    }
    setAllowInsecureRegistries(true)

}


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    // maven { url 'https://repo.spring.io/milestone' }
    // maven {
    // 	url 'http://localhost:8081/repository/maven-central/'
    // 	allowInsecureProtocol = true
    // }
}
ext {
    set('springCloudVersion', '2023.0.6')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.modelmapper:modelmapper:3.1.1'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'org.postgresql:postgresql'

    //implementation 'com.vladmihalcea:hibernate-types-55:2.16.2'

    implementation 'com.fasterxml.jackson.core:jackson-databind'        // core databind + annotations transitively
// optionally explicit:
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-core'

    // implementation 'org.springframework.cloud:spring-cloud-starter-config'
    // implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'org.springframework.security.oauth:spring-security-oauth2:2.3.6.RELEASE'

    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.7.2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}